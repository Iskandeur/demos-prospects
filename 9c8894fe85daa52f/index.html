<script>
async function demoDecrypt(blob, pin){
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(blob.iv) }, key, b(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
var BLOB = JSON.parse(document.getElementById("blob").textContent), PAGES = null, FR = null;
var NAV = "<" + "script>" + "document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\")||\"\";var p=h.split(\"#\")[0].split(\"?\")[0].replace(/^\\.\\//,\"\");if([\"index.html\"].indexOf(p)>=0){e.preventDefault();parent.postMessage({demoPage:p},\"*\")}});" + "<" + "/script>";
function show(name){
  if (!FR) { FR = document.createElement("iframe"); FR.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms"); document.body.appendChild(FR); }
  var h = PAGES[name]; FR.srcdoc = h.indexOf("</body>") >= 0 ? h.replace("</body>", NAV + "</body>") : h + NAV;
}
window.addEventListener("message", function (e) { if (FR && e.source === FR.contentWindow && e.data && PAGES && PAGES[e.data.demoPage]) show(e.data.demoPage); });
document.getElementById("f").addEventListener("submit", async function (ev) {
  ev.preventDefault(); var err = document.getElementById("err"); err.textContent = "";
  try { PAGES = await demoDecrypt(BLOB, document.getElementById("p").value.trim()); }
  catch (x) { err.textContent = x && x.name === "OperationError" ? "Code incorrect." : "Ouverture impossible (" + (x && x.name) + " " + (x && x.message) + ")."; return; }
  document.getElementById("gate").remove(); show("index.html");
});
